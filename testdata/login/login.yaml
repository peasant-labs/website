# The log-in dialog as a reader meets it, and where its github button sends
# them for each address the online app can redirect a signed-out visitor to.
# Authored independently of lib/site.ts: the page has to match this oracle.
version: 1
dialog:
  title: log in to peasant
  github: continue with github
  privacy: { label: privacy notice, href: https://village.peasantlabs.org/privacy }
# the online app's sign-in start; every case below is fulfilled locally, never fetched
online: https://village.peasantlabs.org
# the address the landing page is opened at, and the start address the github button must go to
next:
  - name: no next starts sign-in without one
    address: /?login
    start: https://village.peasantlabs.org/auth/start?provider=github
  - name: a path on the online app is kept
    address: /?login&next=%2Fcollectives%2Fabc
    start: https://village.peasantlabs.org/auth/start?provider=github&next=%2Fcollectives%2Fabc
  - name: a path with its own query is kept whole
    address: /?login&next=%2Fcollectives%2Fabc%3Ftab%3Dsessions
    start: https://village.peasantlabs.org/auth/start?provider=github&next=%2Fcollectives%2Fabc%3Ftab%3Dsessions
  - name: a protocol-relative address to another host is dropped
    address: /?login&next=//evil.example
    start: https://village.peasantlabs.org/auth/start?provider=github
  - name: an encoded protocol-relative address is dropped
    address: /?login&next=%2F%2Fevil.example
    start: https://village.peasantlabs.org/auth/start?provider=github
  - name: a backslash address is dropped
    address: /?login&next=%2F%5Cevil.example
    start: https://village.peasantlabs.org/auth/start?provider=github
  - name: an absolute url is dropped
    address: /?login&next=https%3A%2F%2Fevil.example
    start: https://village.peasantlabs.org/auth/start?provider=github
  - name: a path with a control character is dropped
    address: /?login&next=%2Fcollectives%0A%2Fabc
    start: https://village.peasantlabs.org/auth/start?provider=github
# the header's way in, by what the online app's hint cookie (peasant_online)
# says. `hint` is the cookie's value (null: no cookie); `address` the page
# opened. The header shows "log in" or "open online", never both.
signedIn:
  cookie: peasant_online
  label: open online
  href: https://village.peasantlabs.org
header:
  - name: no hint offers log in
    hint: null
    address: /
    shows: log in
    hintAfter: null
  - name: a hint offers open online with the person's handle
    hint: alice-dev
    address: /
    shows: open online
    hintAfter: alice-dev
  - name: arriving to log in clears a hint left behind
    hint: alice-dev
    address: /?login
    shows: log in
    hintAfter: null
  - name: the docs offer open online too
    hint: alice-dev
    address: /docs
    shows: open online
    hintAfter: alice-dev
# the cases above that must never disappear from this file
required:
  - no hint offers log in
  - a hint offers open online with the person's handle
  - arriving to log in clears a hint left behind
  - a path on the online app is kept
  - a protocol-relative address to another host is dropped
  - a backslash address is dropped
