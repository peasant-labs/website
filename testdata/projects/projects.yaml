catalog:
  storyTitle: from local history to shared context
  figure:
    accessibleName: placeholder for the Peasant Labs suite workflow showing a selected local record, deliberate review, and its governed published copy
    stateText: Peasant Labs suite workflow screenshot forthcoming
    caption: the future image will show a selected local record in Peasant, its deliberate review boundary, and the governed copy explicitly published to Village.
    aspectRatio: "16 / 9"
  cards:
    - id: peasant
      label: Peasant
      target: /projects/peasant
      action: explore Peasant
    - id: village
      label: Village
      target: /projects/village
      action: explore Village
products:
  - id: peasant
    route: /projects/peasant
    advertisedState: private-preview
    availabilityTitle: private preview
    availabilityQualification: preview repository or release access is required before any install or run command can work.
    evidenceSummary: open the full evidence ledger / 10 source records with scope, revision, and provenance
    figure:
      accessibleName: placeholder for the Peasant project timeline showing selected sessions and available Git associations
      stateText: Peasant project timeline screenshot forthcoming
      caption: the future image will show a local project history with session context and association limits visible.
      aspectRatio: "16 / 9"
    features:
      - id: supported-harness-history
        heading: one history across supported harnesses
        evidence: [peasant-adapters, peasant-readme]
      - id: project-context
        heading: project context beyond the transcript
        evidence: [peasant-readme, peasant-selection-redaction]
      - id: local-analysis
        heading: local analysis before publication
        evidence: [peasant-readme, peasant-search]
      - id: redaction-review
        heading: review what leaves the machine
        evidence: [peasant-selection-redaction, peasant-readme]
      - id: schema-backed-sharing
        heading: one typed record from local to shared
        evidence: [schema-rc10, peasant-schema-pin, peasant-readme]
    access:
      - id: preview-access
        body: use a private preview release or repository checkout supplied by a maintainer. there is no signed-out public artifact linked from this page.
        command: null
        action: null
        qualification: the observed private baseline is v0.1.0-rc2 and its placeholder product license is not a public open-source grant.
        evidence: [peasant-rc2-private-release, peasant-license]
    run:
      - id: configure
        body: run the setup wizard after the preview binary is available on PATH.
        command: peasant kickstart
        action: null
        qualification: post-access command for a private preview build.
        evidence: [peasant-readme, peasant-selection-redaction]
      - id: ingest
        body: process discovered sessions that match the configured selection.
        command: peasant ingest
        action: null
        qualification: results depend on retained source transcripts, supported formats, selection, and successful parsing.
        evidence: [peasant-readme, peasant-selection-redaction]
      - id: open-dashboard
        body: start the dashboard backed by the local Peasant store.
        command: peasant web start
        action: null
        qualification: post-access command; the documented default port is 8690.
        evidence: [peasant-readme]
    stories:
      - id: multi-harness-developer
        evidence: [peasant-adapters, peasant-selection-redaction]
      - id: maintainer-context
        evidence: [peasant-readme]
      - id: review-before-share
        evidence: [peasant-selection-redaction, peasant-readme]
    outputs:
      - id: kickstart-summary
        evidence: [peasant-selection-redaction]
        lines:
          - "Redaction:    standard"
          - "Selected:     12 session(s)"
          - "New branches: Auto-ingest"
    related:
      - { id: all-projects, target: /projects }
      - { id: village, target: /projects/village }
      - { id: comparison, target: /projects#comparison }
      - { id: schema, target: https://github.com/peasant-labs/schema/releases/tag/v0.1.0-rc10 }
    requiredEvidence:
      - peasant-rc2-private-release
      - peasant-current-corpus-2026-07-28
      - peasant-readme
      - peasant-adapters
      - peasant-selection-redaction
      - peasant-search
      - peasant-pull
      - peasant-license
      - peasant-schema-pin
      - schema-rc10
  - id: village
    route: /projects/village
    advertisedState: private-contributor-development
    availabilityTitle: private contributor development
    availabilityQualification: repository access, GitHub OAuth credentials, a GitHub token, Docker, Go, Node, and pnpm are prerequisites.
    evidenceSummary: open the full evidence ledger / 7 source records with scope, revision, and provenance
    figure:
      accessibleName: placeholder for the Village collective view showing published session copies and governance state
      stateText: Village collective view screenshot forthcoming
      caption: the future image will show a published copy, its collective access, reuse license, and policy history.
      aspectRatio: "16 / 9"
    features:
      - id: published-copy-boundary
        heading: publish a copy, keep the local source
        evidence: [village-readme, peasant-readme]
      - id: collective-sharing
        heading: share through collectives
        evidence: [village-collectives]
      - id: access-and-license
        heading: choose access and reuse separately
        evidence: [village-governance, schema-rc10]
      - id: governance-history
        heading: preserve a policy change history
        evidence: [village-governance]
      - id: one-way-pull
        heading: pull context without republishing it
        evidence: [peasant-pull, village-governance]
    access:
      - id: contributor-access
        body: Peasant Labs is open-sourcing the governance and access-control layer for agentic coding data in the Village repository.
        command: null
        action:
          label: open the Village repository
          accessibleName: open the Village repository on GitHub; currently private
          target: https://github.com/peasant-labs/village
        qualification: the repository is private now, so signed-out visitors may receive a 404 until its visibility changes. this link is not a public download, self-host release, product license, or license grant.
        evidence: [village-readme]
      - id: configure-development
        body: copy the environment template, then supply GitHub OAuth credentials, a GitHub token, and the other documented secrets.
        command: cp .env.example .env
        action: null
        qualification: private contributor-development command; it is not a public install path.
        evidence: [village-readme]
    run:
      - id: publish-from-peasant
        body: after authentication and review, publishing is initiated by the Peasant CLI rather than an upload control in Village.
        command: peasant village push
        action: null
        qualification: private current-source flow; publication remains an explicit user action.
        evidence: [peasant-readme, village-readme]
    stories:
      - id: selected-publisher
        evidence: [peasant-readme, village-readme, village-governance]
      - id: collective-curator
        evidence: [village-collectives]
      - id: authorized-pull
        evidence: [peasant-pull, village-governance]
      - id: policy-steward
        evidence: [village-governance]
    outputs:
      - id: governance-record
        evidence: [village-governance, schema-rc10]
        lines:
          - "event: governance_changed"
          - "visibility: shared"
          - "license: CC-BY-4.0"
    related:
      - { id: all-projects, target: /projects }
      - { id: peasant, target: /projects/peasant }
      - { id: comparison, target: /projects#comparison }
      - { id: schema, target: https://github.com/peasant-labs/schema/releases/tag/v0.1.0-rc10 }
    requiredEvidence:
      - village-readme
      - village-collectives
      - village-governance
      - village-schema-pin
      - peasant-readme
      - peasant-pull
      - schema-rc10
