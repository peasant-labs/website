site:
  baseUrl: https://peasantlabs.org
  routes:
    - id: home
      path: /
      h1: Reclaiming Data Autonomy as a Peasant
      metadata:
        title: Reclaiming Data Autonomy as a Peasant
        description: an upcoming editorial on the quiet enclosure of the transcript commons, and why the harvest belongs to the hands that sowed it.
        canonical: https://peasantlabs.org
        openGraph:
          title: Reclaiming Data Autonomy as a Peasant
          description: forthcoming — on the quiet enclosure of the transcript commons.
          url: https://peasantlabs.org
          type: article
        twitter:
          card: summary_large_image
          title: Reclaiming Data Autonomy as a Peasant
          description: forthcoming — on the quiet enclosure of the transcript commons.
    - id: projects
      path: /projects
      h1: a commons for AI coding transcripts
      metadata:
        title: projects | peasant labs
        description: peasant keeps the sessions your coding agents leave behind on your own machine. village is where you publish the ones worth sharing.
        canonical: https://peasantlabs.org/projects
        openGraph:
          title: projects | peasant labs
          description: peasant keeps the sessions your coding agents leave behind on your own machine. village is where you publish the ones worth sharing.
          url: https://peasantlabs.org/projects
          type: website
        twitter:
          card: summary_large_image
          title: projects | peasant labs
          description: peasant keeps the sessions your coding agents leave behind on your own machine. village is where you publish the ones worth sharing.
    - id: peasant
      path: /projects/peasant
      h1: keep your coding-agent transcripts. share the ones you choose.
      metadata:
        title: "peasant: local coding-agent project history"
        description: peasant normalizes supported coding-agent sessions into a local project history for analysis, review, redaction, and explicit sharing.
        canonical: https://peasantlabs.org/projects/peasant
        openGraph:
          title: "peasant: local coding-agent project history"
          description: peasant normalizes supported coding-agent sessions into a local project history for analysis, review, redaction, and explicit sharing.
          url: https://peasantlabs.org/projects/peasant
          type: website
        twitter:
          card: summary_large_image
          title: "peasant: local coding-agent project history"
          description: peasant normalizes supported coding-agent sessions into a local project history for analysis, review, redaction, and explicit sharing.
    - id: village
      path: /projects/village
      h1: a commons for selected agent work
      metadata:
        title: "village: a governed commons for agent sessions"
        description: village stores selected published session copies for governed discovery, collective access, licensing, audit history, and one-way pull.
        canonical: https://peasantlabs.org/projects/village
        openGraph:
          title: "village: a governed commons for agent sessions"
          description: village stores selected published session copies for governed discovery, collective access, licensing, audit history, and one-way pull.
          url: https://peasantlabs.org/projects/village
          type: website
        twitter:
          card: summary_large_image
          title: "village: a governed commons for agent sessions"
          description: village stores selected published session copies for governed discovery, collective access, licensing, audit history, and one-way pull.
  sitemap:
    - https://peasantlabs.org
    - https://peasantlabs.org/projects
    - https://peasantlabs.org/projects/peasant
    - https://peasantlabs.org/projects/village
catalog:
  cards:
    - id: peasant
      label: peasant
      target: /projects/peasant
      action: explore peasant
      kind: local
    - id: village
      label: village
      target: /projects/village
      action: explore village
      kind: open-source
  # "what is peasant labs?" is the one-paragraph answer and carries no cards;
  # the cards have a section of their own immediately before the comparison.
  whatTitle: what is peasant labs?
  # two authored lines: the break is a real newline in the DOM, rendered by CSS
  # rather than left to wherever the column happens to wrap.
  cardsTitle: "our projects,\nlocal and open-source"
viewer:
  title: '"hey, can you help me review this?"'
  label: sample session in the transcript browser
  sessionId: sess_7f2a91
  # the demo transcript must never read as a real record
  disclosure: sample data, not a real record
  turns: 7
  # the viewer opens on its own summary, not in the middle of the raw log
  openingTab: highlights
  otherTab: full trace
# one line and nothing under it: the story section says what it does.
install:
  command: curl -fsSL https://peasantlabs.org/install | bash
# the walkthrough runs in fairtrade's own onboarding component: every step
# carries the command it runs, so there is no unsourced step and no screenshot
# placeholder standing in for one.
story:
  title: install, share, and leverage your data
  stepsLabel: getting started, install to published copy
  steps:
    - { id: install, title: install, command: curl -fsSL https://peasantlabs.org/install | bash }
    - { id: ingest, title: ingest your transcripts, command: peasant ingest }
    - { id: open-the-dashboard, title: open the dashboard, command: peasant web start }
    - { id: contribute-to-the-commons, title: contribute to the commons, command: peasant village push }
# the redaction panel runs on invented matches. no real key, address, or token
# appears on the page, and the section says so above the panel.
redaction:
  title: what stays private when you share
  note: sample data, not a real scan.
  # standard is the only level that ships; minimal and maximum are gone.
  level: standard
  removedLevels: [minimal, maximum]
  matches:
    - { id: api-key, category: api-key, kept: false, secret: 'const BILLING_KEY = "sk_demo_000000000000000000example"', after: 'const BILLING_KEY = "sk_demo_••••••••••••••••••••••"' }
    - { id: email, category: email, kept: true, secret: "// reported by alex.rivera@example.com on the 0.4 rollout", after: "// reported by ‹redacted-email› on the 0.4 rollout" }
    - { id: bearer-token, category: bearer-token, kept: false, secret: 'Authorization: "Bearer demo.example.token.value"', after: 'Authorization: "Bearer ‹redacted-token›"' }
community:
  title: building for community first
  points:
    - publishing is always a deliberate act, never a default
    - every shared session carries the reuse license you picked
    - groups set their own rules, open to all or approved by the owner
faq:
  title: questions
  label: frequently asked questions
  # The licensing answer is load-bearing: the peasant-license evidence record
  # confirms Apache-2.0 source, so this page must not keep old private-preview claims.
  forbiddenClaims:
    - private preview
    - placeholder license
    - not open source yet
  questions:
    - { id: open-source, question: "is it open source?" }
    - { id: agents, question: "which coding agents does it read?" }
    - { id: uploads, question: "does anything get uploaded on its own?" }
    - { id: search, question: "how good is the search?" }
    - { id: others-work, question: "what about sessions other people publish?" }
    - { id: village, question: "do i have to use village?" }
