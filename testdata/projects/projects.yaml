comparison:
  title: an independent comparison with Entire
  scrollHelp: scroll horizontally to compare all columns.
  caption: "independent comparison: Peasant plus Village plus Schema versus Entire CLI plus Entire.io and its documented repository service. verified 2026-07-28."
  bundleDefinition: Peasant Labs means Peasant, Village, and the public Schema contract. Entire means Entire CLI, Entire.io, and its documented repository service.
  verifiedOn: 2026-07-28
  reverifyBy: 2026-08-27
  reviewOwner: Peasant Labs website maintainers
  meaningNote: not documented means no equivalent was found in the reviewed materials, not that one cannot exist.
  groups:
    - shared-baseline
    - retrieval-and-continuation
    - sharing-and-governance
    - infrastructure-and-maturity
  rows:
    - id: existing-local-agent-history
      group: shared-baseline
      peasantLabs:
        status: supported
        sourceScope: current-source
        qualification: four current-source adapters feed one canonical Peasant session-detail path.
        sources: [peasant-adapters, peasant-readme, schema-rc10]
      entire:
        status: supported
        sourceScope: vendor-documented
        qualification: Entire documents historical import, eight named built-ins, and executable plugins.
        sources: [entire-agents, entire-import-history]
      takeaway: both import cross-agent history; Entire documents broader integration coverage.
    - id: session-context-linked-to-git
      group: shared-baseline
      peasantLabs:
        status: partial
        sourceScope: current-source
        qualification: Peasant stores durable associations only where commit detection observes them.
        sources: [peasant-readme]
      entire:
        status: supported
        sourceScope: vendor-documented
        qualification: Entire documents automatic Git-linked checkpoints as a core workflow.
        sources: [entire-quickstart, entire-agents]
