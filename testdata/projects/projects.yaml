catalog:
  cards:
    - id: peasant
      label: peasant
      target: /projects/peasant
      action: explore peasant
      kind: local
    - id: village
      label: online
      target: /projects/village
      action: explore online
      kind: open-source
  # "what is peasant?" is the one-paragraph answer and carries no cards;
  # the cards have a section of their own immediately before the comparison.
  whatTitle: what is peasant?
  # two authored lines: the break is a real newline in the DOM, rendered by CSS
  # rather than left to wherever the column happens to wrap.
  cardsTitle: "our projects,\nlocal and open-source"
viewer:
  title: '"hey, can you help me review this?"'
  label: sample session in the transcript browser
  sessionId: sess_7f2a91
  # the demo transcript must never read as a real record
  disclosure: Sample data, not a real record
  turns: 7
  # the viewer opens on its own summary, not in the middle of the raw log
  openingTab: highlights
  otherTab: full trace
# one line and nothing under it: the story section says what it does.
install:
  command: curl -fsSL https://peasantlabs.org/install | bash
# the walkthrough runs in fairtrade's own onboarding component: every step
# carries the command it runs, so there is no unsourced step and no screenshot
# placeholder standing in for one.
story:
  title: install, keep, and share your sessions
  stepsLabel: getting started, install to published copy
  steps:
    - { id: install, title: install, command: curl -fsSL https://peasantlabs.org/install | bash }
    - { id: ingest, title: bring your sessions in, command: peasant ingest }
    - { id: open-the-dashboard, title: open it in your browser, command: peasant web start }
    - { id: contribute-to-the-commons, title: share one session, command: peasant village push }
# the redaction panel runs on invented matches. no real key, address, or token
# appears on the page, and the section says so above the panel.
redaction:
  title: what stays private when you share
  note: Sample data, not a real scan.
  # standard is the only level that ships; minimal and maximum are gone.
  level: standard
  removedLevels: [minimal, maximum]
  matches:
    - { id: api-key, category: secrets, label: CREDENTIAL, kept: false, secret: 'const BILLING_KEY = "sk_demo_000000000000000000example"', after: 'const BILLING_KEY = "sk_demo_••••••••••••••••••••••"' }
    - { id: email, category: pii, label: PII, kept: true, secret: "// reported by alex.rivera@example.com on the 0.4 rollout", after: "// reported by ‹redacted-email› on the 0.4 rollout" }
    - { id: bearer-token, category: secrets, label: CREDENTIAL, kept: false, secret: 'Authorization: "Bearer demo.example.token.value"', after: 'Authorization: "Bearer ‹redacted-token›"' }
community:
  title: building for community first
  points:
    - Publishing is always a deliberate act, never a default
    - Every shared session carries the reuse license you picked
    - Groups set their own rules, open to all or approved by the owner
faq:
  title: questions
  label: frequently asked questions
  # The licensing answer is load-bearing: the peasant-license evidence record
  # confirms Apache-2.0 source, so this page must not keep old private-preview claims.
  forbiddenClaims:
    - private preview
    - placeholder license
    - not open source yet
  questions:
    - { id: open-source, question: "is it open source?" }
    - { id: agents, question: "which coding agents does it read?" }
    - { id: uploads, question: "does anything get uploaded on its own?" }
    - { id: search, question: "how good is the search?" }
    - { id: others-work, question: "what about sessions other people publish?" }
    - { id: village, question: "do i have to use peasant online?" }
peasant:
  route: /projects/peasant
  hero:
    title: keep your coding-agent transcripts. share the ones you choose.
  # no hero figure yet — peasant ships without a screenshot placeholder.
  # the install sequence lives with the product it installs, not in the catalog.
  start:
    title: get started
    stepsLabel: setup steps
    continueLabel: continue
    doneLabel: done
    backLabel: back
    copyAllLabel: copy all commands
    steps:
      - { id: install, title: install, comment: "# One line installs peasant", command: curl -fsSL https://peasantlabs.org/install | bash }
      - { id: set-up, title: set up, comment: "# Choose which projects and sessions to keep", command: peasant kickstart }
      - { id: bring-work-in, title: bring your work in, comment: "# Reads what your agents already saved", command: peasant ingest }
      - { id: open-it, title: open it, comment: "# Opens your sessions in the browser", command: peasant web start }
      - { id: share-one, title: share one, comment: "# Sends one copy to peasant online, only when you ask", command: peasant village push }
  uses:
    - { id: remember-why, title: you forgot how something got built }
    - { id: one-list-for-every-tool, title: you use more than one coding agent }
    - { id: share-just-one, title: you want to share one session }
  related:
    - { id: all-projects, target: /projects }
    - { id: village, target: /projects/village }
    - { id: comparison, target: /projects#comparison }
# village is a short launch surface now (title, get-started wizard, join community).
# comparison still cites village evidence records below.
