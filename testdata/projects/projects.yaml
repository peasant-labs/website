comparison:
  title: how it compares to similar tools
  intro: Here is what peasant does next to the closest public tools in this space, checked against their public docs and our own source.
  bundleDefinition: Peasant here means both tools, peasant on your computer and peasant online, and the schema they share. The other column covers similar tools and the documentation they publish.
  meaningNote: A dash means we did not find it in those tools' public docs. It does not mean they cannot do it.
  rows:
    - id: keep-it-local
      capability: keep everything on your own machine
      peasantLabs:
        status: "yes"
        qualification: Sessions are stored in a local database, and anything leaving it is an explicit action.
        sources: [peasant-readme]
      entire:
        status: "yes"
        qualification: Entire documents local checkpoints with pushing turned off.
        sources: [entire-checkpoint-storage, entire-keep-local]
    - id: read-past-sessions
      capability: read the sessions your agents already saved
      peasantLabs:
        status: "yes"
        qualification: Reads Claude Code, OpenCode, Codex, Cursor, Strike, and Pi sessions into one record.
        sources: [peasant-adapters, peasant-readme]
      entire:
        status: "yes"
        qualification: Entire documents importing past agent history and covers more integrations.
        sources: [entire-import-history, entire-agents]
    - id: search-past-work
      capability: search your past work
      peasantLabs:
        status: partial
        qualification: Keyword search over saved messages, not meaning-based search.
        sources: [peasant-search]
      entire:
        status: "yes"
        qualification: Entire documents combined meaning-based and keyword search.
        sources: [entire-search]
    - id: publish-selected
      capability: publish only the sessions you pick
      peasantLabs:
        status: "yes"
        qualification: The developer chooses the sessions and collectives to publish; originals stay local.
        sources: [peasant-readme, village-readme]
      entire:
        status: partial
        qualification: Entire documents repository-level checkpoint sync and shareable Markdown summaries; these do not establish per-session publication approval.
        sources: [entire-platform, entire-keep-local, entire-dispatches]
    - id: reuse-license
      capability: set a reuse license on what you share
      peasantLabs:
        status: "yes"
        qualification: An optional Creative Commons choice travels with each published copy.
        sources: [village-governance, peasant-pull]
      entire:
        status: not-documented
        qualification: We found no per-session reuse license in Entire's public docs.
        sources: [entire-declared-corpus-2026-10-30]
    - id: shared-groups
      capability: share into a group other people can join
      peasantLabs:
        status: "yes"
        qualification: Peasant online collectives are either open to contributions or approved by the owner.
        sources: [village-collectives]
      entire:
        status: not-documented
        qualification: We found no equivalent group moderation model in Entire's public docs.
        sources: [entire-declared-corpus-2026-10-30]
