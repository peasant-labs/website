# The docs section ids other apps link to. The online and local apps send
# readers here instead of teaching how-to in the app, so every id below is a
# public address: add ids freely, never rename or remove one.
version: 1
pages:
  - path: /docs
    ids: [quickstart, install, kickstart, record, sign-in, publish, auto-publish, code-map, changes, agents, redaction, access, prune, configuration, cli]
  - path: /docs/guides/evals
    ids: [task, score, collective, install, invite, publish, approve, pull, inspect]
  - path: /docs/guides/reviews
    ids: [example, link, show, publish, attach, review, troubleshooting]
  - path: /docs/guides/classroom
    ids: [assignment, collective, submit, review]
  - path: /docs/guides/onboarding
    ids: [choose, trace, reuse, offline]
  - path: /docs/guides/find-sessions
    ids: [import, narrow, read, missing]
