# The landing page, docs shell and blog as a reader meets them. Every value is
# authored here independently of lib/, so the page has to match the oracle
# rather than the oracle being read back from the page.
version: 1
header:
  nav:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
  login: { label: log in, href: "/?login" }
  # the phone menu mirrors the header's destinations, then its actions; the rest of the site is in the footer
  menu:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
footer:
  # the call to action every page ends with; install points at the landing's
  # install section, in place on the landing and across from any other page
  cta:
    line: try peasant on your own agent sessions
    primary: { label: install now, href: "/#install", landingHref: "#install" }
    secondary: { label: read our docs, href: /docs }
  nav:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
    - { label: projects, href: /projects }
    - { label: github, href: https://github.com/peasant-labs }
    - { label: contact, href: "mailto:hello@peasantlabs.org" }
hero:
  title: the open-source commons for agent transcripts
  lede: Peasant gathers the sessions your coding agents save on your computer. Before you share one, Peasant hides its secrets and personal details.
  pillars: [permissioned sharing, open source, works with many agents, data attribution]
  # how the four tags sit at each width, as tags per line: one row, two and two, or one column; never a lone tag
  # after a pair
  tagRows:
    - { width: 1440, rows: [4] }
    - { width: 768, rows: [2, 2] }
    - { width: 390, rows: [1, 1, 1, 1] }
    - { width: 360, rows: [1, 1, 1, 1] }
  # the picture under the buttons shows no words; its accessible name names the agents peasant reads
  flow:
    agents: [Claude Code, Codex, Cursor, OpenCode, Pi, Strike]
    # The people stay planted through every stage of the card journey.
    groundedFrames: [0, 2400, 3000, 3500, 4300]
    journeyFrames:
      - { name: screen, time: 450 }
      - { name: scan, time: 1000 }
      - { name: flight, time: 1500 }
      - { name: crest, time: 2000 }
      - { name: landed, time: 3000 }
      - { name: settled, time: 3250 }
    # Relative geometry protects a raised transcript and a planted group in depth.
    layouts:
      - { name: phone-light, interaction: true, width: 390, colorScheme: light, raisedGap: 0.07, frontDepth: 0.07, titleLines: [the open-source, commons for, agent transcripts], missionBeside: false, missionArtMax: 224 }
      - { name: phone-dark, interaction: true, width: 390, colorScheme: dark, raisedGap: 0.07, frontDepth: 0.07, titleLines: [the open-source, commons for, agent transcripts], missionBeside: false, missionArtMax: 224 }
      - { name: tablet-light, interaction: false, width: 768, colorScheme: light, raisedGap: 0.12, frontDepth: 0.06, titleLines: [the open-source commons, for agent transcripts], missionBeside: true, missionArtMax: 448 }
      - { name: tablet-dark, interaction: false, width: 768, colorScheme: dark, raisedGap: 0.12, frontDepth: 0.06, titleLines: [the open-source commons, for agent transcripts], missionBeside: true, missionArtMax: 448 }
      - { name: desktop-light, interaction: true, width: 1440, colorScheme: light, raisedGap: 0.12, frontDepth: 0.06, titleLines: [the open-source commons, for agent transcripts], missionBeside: true, missionArtMax: 448 }
      - { name: desktop-dark, interaction: true, width: 1440, colorScheme: dark, raisedGap: 0.12, frontDepth: 0.06, titleLines: [the open-source commons, for agent transcripts], missionBeside: true, missionArtMax: 448 }
  primary: { label: install now, target: install }
  secondary: { label: learn more, target: how }
# the band under the hero: the harnesses peasant reads, each led by its mark
agents:
  label: works with
  names: [Claude Code, Codex, Cursor, OpenCode, Pi, Strike]
# the sections after the hero, in reading order: id and heading
sections:
  - { id: install, heading: install, then ask your agent }
  - { id: uses, heading: find your use case }
  - { id: how, heading: how it works }
  - { id: session, heading: "a new standard for transcript sharing, viewing, and attribution" }
# copy from earlier designs of the page that must not come back
removed:
  - featured collectives
  - built to be trusted
  - bring it to your lab
  - redacted on your computer
  - six agent harnesses
  - they see how it is used
  - discord
  - data commons built by commoners
# one row of every capability, each tagged with its audience and saying in one or two sentences
# what it is (all twelve in the server's HTML); grouped here by audience; then one card on to the docs
useCases:
  # one shape for every card at each screen width: its width in px, and the lines its headline takes
  # (one on a wide screen, two reserved on a phone); its words take at most three lines, with room for three
  shape:
    - { width: 1440, card: [425, 440], headline: 1 }
    - { width: 1280, card: [425, 440], headline: 1 }
    - { width: 1024, card: [425, 440], headline: 1 }
    - { width: 390, card: [325, 340], headline: 2 }
  detailLines: 3
  more:
    tag: docs
    text: explore more in the docs
    detail: Set up, publishing, redaction and collectives, with guides for evals and pull request reviews.
    picture: uc-docs
    cta: { label: read our docs, href: /docs }
  slides:
    - id: researchers
      label: researchers
      capabilities: [build evals from real work, study how agents are used, run a class with open agent use]
      details:
        - "Collect real coding transcripts in a private collective, then download them to test agents."
        - "Read how people actually talk to their agents and correct them, in transcripts shared with your collective."
        - "Students publish their sessions to your class's collective, so you can see how each worked with an agent."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-balance, uc-book, uc-slate]
    - id: teams
      label: teams
      capabilities: [review the work behind a diff, onboard from real history, "learn from each other's prompts"]
      details:
        - "Attach the transcripts behind your pull request, so your collective can read how the change was made."
        - "New teammates read the transcripts behind past pull requests to learn why the code looks the way it does."
        - "Read what your teammates typed to their agents in the transcripts they share, and reuse what works."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-lens, uc-signpost, uc-candles]
    - id: developers
      label: developers
      capabilities: [find any past session, explain a PR in one comment, publish on every push]
      details:
        - "Search and open your past sessions from supported agents, all kept on your computer."
        - "Comment /peasant attach on your pull request, then confirm, to link your transcripts behind its commits."
        - "Automatically push sessions to your chosen collectives."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-lantern, uc-door, uc-bell]
    - id: companies
      label: companies
      capabilities: [keep agent data in-house, see which commits agents wrote, usage across teams]
      details:
        - "Only members of your collective can read its transcripts, and joining can be limited to your GitHub org."
        - "A session is linked to the commits its author made while it ran, so a change traces back to its transcript."
        - "Your collective's page lists who shared what, with which agent, plus token and pull request totals."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-chest, uc-scroll, uc-sacks]
how:
  steps:
    - title: record
      body: Peasant saves every coding agent session on your computer. Type /peasant in Claude Code to open it in your browser.
    - title: review
      body: Before anything leaves your computer, peasant hides keys, personal details, file paths and project names, and shows you what it hid.
    - title: publish
      body: Pick who can read it, like your team or a research group, and publish. Nothing leaves until you do.
  publishLabel: publish
  # the smallest any word in a scene may render, in px, on a wide screen and on a phone
  readable: { wide: 14, phone: 12 }
  # what each scene shows on its finished frame, read from the real components
  finals:
    - { scene: record, texts: ["Welcome to Claude Code!", "> /peasant", 'peasant: opened "fix the staging 403" · not published', "fix the staging 403", "not published"] }
    - { scene: review, texts: ["3 matches", "<AWS_ACCESS_KEY>", "<EMAIL>", "/Users/<USER>/src/shop/.env"] }
    - { scene: publish, texts: ["fix the staging 403", "published", "eval-crowd"] }
# One terminal command starts installation and local setup; the second block is
# a prompt for the agent, never another command the terminal executes.
install:
  platforms:
    - { label: macos and linux, command: "curl -fsSL https://peasantlabs.org/install | bash -s -- --kickstart", note: run in your terminal to install and start kickstart }
    - { label: windows, command: "irm https://peasantlabs.org/install.ps1 | iex", note: "install on windows, then run the kickstart command printed in your terminal" }
  prompt: Publish this session with Peasant. Ask which collective if needed.
  notes:
    - run in your terminal to install and start kickstart
    - then ask your coding agent to publish this session
  guide: { label: read our docs, href: /docs }
  installGuide: { label: read the install guide, href: "/docs#install" }
  phoneWidths: [390, 360, 320]

session:
  windows:
    widths: [1440, 1024, 768]
    frontMinRatio: 0.8
    frontMaxRatio: 0.95
    terminalExposedMin: 144
    socialOverlapMax: 112
  terminalBodyMin: 240
  terminalTextMin: 16
  sharedBodyMin: 380
  label: a sample session
  # the viewer names the sample by this short title; its id is shown nowhere
  title: rewrite billing retries
  sessionId: sess_8d3f52
  # the author the header shows: the publisher's handle, not a redaction marker
  author: "@mira_builds"
  # how long before the reader arrived the sample ended: every post in the thread comes after it
  endedAgo: 50m
  # on a phone, the slice shown instead of the windows: the prompt, the redacted line of the .env it read, and the commit
  phone:
    widths: [360, 390]
    headingLevel: 3
    prompt: hey claude, run our billing retry suite against each model, same seed, and write a table of pass rate, tokens and wall time per model
    tool: .env
    key: AWS_ACCESS_KEY_ID=
    marker: "<AWS_ACCESS_KEY>"
    commit: 7c3e9a1
    stat: "+36 −1, 2 files"
  # the terminal window's title, and the sample's first ask word for word (the Terminal repeats it)
  terminal: billing — claude — 80×24
  firstAsk: hey claude, run our billing retry suite against each model, same seed, and write a table of pass rate, tokens and wall time per model
  # what the sample carries so a card can show its figures: the prompt count equals the user turns, the token
  # total sits on the session, and no turn carries a usage count of its own
  figures: { model: claude-opus-5-5, inputSubmissionCount: 5, totalTokens: 52600 }
  # the transcript browser's own tabs, as online's transcript page shows them
  tabs: [highlights, full trace, diffs, files, annotations]
  # placeholders the redaction engine writes, visible in the transcript
  markers: ["<USER>", "<AWS_ACCESS_KEY>", "<EMAIL>"]
graphs:
  - { name: landing-light, path: /, selector: "[data-session-viewer]", width: 1440, theme: light }
  - { name: landing-dark, path: /, selector: "[data-session-viewer]", width: 1440, theme: dark }
  - { name: projects-light, path: /projects, selector: "[data-transcript-demo]", width: 1440, theme: light }
  - { name: projects-dark, path: /projects, selector: "[data-transcript-demo]", width: 1440, theme: dark }
# the share card the transcript's link preview shows, drawn by fairtrade from the sample: its figures are the
# sample's own prompt count and token total
card:
  figures: { prompts: 5, tokens: 52600 }
# the X thread beside the windows: mira's benchmark, a reply asking for the prompt, and her answer, which is only
# the transcript's link preview; it is read as one short group. Each post's time is its age, after the session ended
# and newer down the thread
thread:
  label: a thread on X sharing the transcript
  posts:
    - { name: mira, handle: "@mira_builds", time: 40m, text: "I ran some experiments with the new Opus 5.5. here's how it did vs the last two models" }
    - { name: doofus, handle: "@doofuslord69", time: 25m, text: wat prompt did u use }
    - { name: mira, handle: "@mira_builds", time: 18m, text: "" }
  # X's actions under every post, in X's order
  actions: [reply, repost, like, views, bookmark, share]
  # the system face X's posts are set in, at the head of the thread's computed font stack, with or without a window
  face: -apple-system
  # the bars of the first post's chart, oldest model first: each value is that model's pass rate in the sample's table
  chart:
    - { label: model A, value: 71 }
    - { label: model B, value: 83 }
    - { label: Opus 5.5, value: 94 }
  from: From village.peasantlabs.org
  # on a phone the thread follows the session's slice at the column's width, with no window around it: its post text
  # and the card's prompt, measured as drawn (the card's own size times its scale), stay readable at the phone widths
  # the session tests (session.phone.widths)
  phone: { postText: 12, cardPrompt: 11, promptWord: hey }
# the owner's statement, word for word: the lead line, then two paragraphs (the landing and /about)
vision:
  artMax: 448
  line: We are building a sustainable, respectful ecosystem where people have a stake in the data they produce.
  story:
    - "Peasants once worked shared land, until it was fenced off and sold. The work we do with AI is being fenced off the same way: every question, fix and judgment you make with an agent becomes part of someone else's capital."
    - "We think the work also belongs to the people who did it. You decide what is hidden and who may read it. What you choose to give goes into a commons that everyone can use."
  cta: { label: about us, href: /about }
docsNav:
  - { label: overview, href: /docs }
  - { label: agent evals, href: /docs/guides/evals }
  - { label: pr reviews, href: /docs/guides/reviews }
  - { label: blog, href: /blog }
# Pages lead; search sits near the account footer. The docs app has no other app in its switcher.
docsNavigation: [docs pages, guides, more, shortcuts]
docsShortcuts: [search]
posts:
  - { slug: reclaiming-data-autonomy-as-a-peasant, title: Reclaiming Data Autonomy as a Peasant }
