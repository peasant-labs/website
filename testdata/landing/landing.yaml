# The landing page, docs shell and blog as a reader meets them. Every value is
# authored here independently of lib/, so the page has to match the oracle
# rather than the oracle being read back from the page.
version: 1
header:
  nav:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
  login: { label: log in, href: "/?login" }
  # the phone menu, in order, then its actions
  menu:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
    - { label: projects, href: /projects }
    - { label: about, href: /about }
    - { label: contact, href: /contact }
footer:
  # the call to action every page ends with; install points at the landing's
  # install section, in place on the landing and across from any other page
  cta:
    line: try peasant on your own agent sessions
    primary: { label: install now, href: "/#install", landingHref: "#install" }
    secondary: { label: read our docs, href: /docs }
  nav:
    - { label: docs, href: /docs }
    - { label: blog, href: /blog }
    - { label: projects, href: /projects }
    - { label: github, href: https://github.com/peasant-labs }
    - { label: contact, href: /contact }
hero:
  title: the open-source commons for agent transcripts
  lede: Peasant keeps your coding agent sessions on your computer. When you publish one, it is redacted there first and shared under your handle, only with the collectives you pick.
  pillars: [local first, open source, agent-agnostic, incremental indexing]
  # the picture under the buttons shows no words; its accessible name names the agents peasant reads
  flow:
    agents: [Claude Code, Codex, Cursor, OpenCode, Pi, Strike]
    pause: pause the animation
    play: play the animation
  primary: { label: install now, target: install }
  secondary: { label: learn more, target: how }
# the band under the hero: the harnesses peasant reads, each led by its mark
agents:
  label: works with
  names: [Claude Code, Codex, Cursor, OpenCode, Pi, Strike]
# the sections after the hero, in reading order: id and heading
sections:
  - { id: install, heading: get started in three commands }
  - { id: uses, heading: find your use case }
  - { id: how, heading: how it works }
  - { id: session, heading: "we're setting a new standard for transcript sharing and viewing" }
# copy from earlier designs of the page that must not come back
removed:
  - featured collectives
  - built to be trusted
  - bring it to your lab
  - redacted on your computer
  - six agent harnesses
  - they see how it is used
  - discord
  - data commons built by commoners
# one row of every capability, each tagged with its audience and saying in one or two sentences
# what it is (all twelve in the server's HTML); grouped here by audience
useCases:
  slides:
    - id: researchers
      label: researchers
      capabilities: [build evals from real work, study how agents are used, run a class on agents]
      details:
        - "Gather redacted transcripts of real coding work in a private collective, as source material for your evals."
        - "Read how people prompt, steer and correct their agents in the transcripts published to your collective."
        - "Students publish their sessions to your class's collective, so you can see how each worked with an agent."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-balance, uc-book, uc-slate]
      cta: { label: sign up free, href: "/?login" }
    - id: teams
      label: teams
      capabilities: [review the work behind a diff, onboard from real history, "learn from each other's prompts"]
      details:
        - "Link the transcripts behind a pull request's commits, so reviewers in your collective read how it was made."
        - "New teammates read the transcripts behind past pull requests to learn how and why the code got this way."
        - "See how teammates prompt and steer their agents, and reuse what works."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-lens, uc-signpost, uc-candles]
      cta: { label: sign up free, href: "/?login" }
    - id: developers
      label: developers
      capabilities: [find any past session, explain a change in one comment, publish on every push]
      details:
        - "Peasant indexes sessions from the agents it supports on this computer, so you can search them and open one."
        - "Comment /peasant attach on a pull request, then confirm, to link your transcripts that match its commits."
        - "Each time you push, a git hook publishes the repository's sessions, redacted, to the collectives you chose."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-lantern, uc-door, uc-bell]
      cta: { label: install now, href: "#install" }
    - id: companies
      label: companies
      capabilities: [keep agent data in-house, see which commits agents wrote, usage across teams]
      details:
        - "Only your collective's members can read its transcripts, and joining can be limited to your GitHub org."
        - "Peasant links a session to the commits made while it ran, so a change traces back to its transcript."
        - "A collective lists each transcript's contributor, agent and turns, with token and pull request totals."
      # each capability's own picture, in caption order: public/art/<name>-light.png and -dark.png
      pictures: [uc-chest, uc-scroll, uc-sacks]
      cta: { label: talk to us, href: "mailto:hello@peasantlabs.org" }
how:
  steps:
    - title: record
      body: Peasant saves every coding agent session on your computer. Type /peasant in Claude Code to open it in your browser.
    - title: review
      body: Before anything leaves your computer, peasant hides keys, personal details, file paths and project names, and shows you what it hid.
    - title: publish
      body: Pick who can read it, like your team or a research group, and publish. Nothing leaves until you do.
  publishLabel: publish
  # what each scene shows on its finished frame, read from the real components
  finals:
    - { scene: record, texts: ["Welcome to Claude Code!", "> /peasant", 'peasant: opened "fix the staging 403" · not published', "fix the staging 403", "not published"] }
    - { scene: review, texts: ["3 matches", "<AWS_ACCESS_KEY>", "<EMAIL>", "/Users/<USER>/src/shop/.env"] }
    - { scene: publish, texts: ["fix the staging 403", "published", "eval-crowd"] }
# the commands as scripts/install.sh and scripts/install.ps1 document themselves, then the two that are
# the same on every system, each with what it does in plain words (docs: kickstart, publishing from the terminal)
install:
  platforms:
    - { label: macos and linux, command: "curl -fsSL https://peasantlabs.org/install | bash" }
    - { label: windows, command: "irm https://peasantlabs.org/install.ps1 | iex" }
  kickstart: peasant kickstart
  push: peasant village push
  notes:
    - installs peasant on your computer
    - finds your sessions, asks what to record, and can sign you in
    - publishes your chosen sessions to peasant online, secrets hidden, private to you
  guide: { label: read our docs, href: /docs }
session:
  label: a sample session
  # the viewer names the sample by this short title; its id is shown nowhere
  title: fix the staging 403
  sessionId: sess_c41e07
  # the transcript browser's own tabs, as online's transcript page shows them
  tabs: [highlights, full trace, diffs, files, annotations]
  # the tour on first view: the tool call it opens, and the marker it rests on there
  tour: { tool: .env, marker: "<AWS_ACCESS_KEY>" }
  replay: replay tour
  # the pull request's check, in village's own words (backend/internal/digest/render.go) for one transcript and one commit
  check: { name: peasant / prompts, summary: 1 transcript traces 1 of 1 commits }
  # placeholders the redaction engine writes, visible in the transcript
  markers: ["<USER>", "<AWS_ACCESS_KEY>", "<EMAIL>"]
vision:
  line: We are building a sustainable, respectful ecosystem where people have a stake in their data.
  cta: { label: about us, href: /about }
docsNav:
  - { label: overview, href: /docs }
  - { label: agent evals, href: /docs/guides/evals }
  - { label: pr reviews, href: /docs/guides/reviews }
  - { label: blog, href: /blog }
# the docs switcher: no other app, only what is coming (the account row reaches online)
docsSwitcher: [community]
posts:
  - { slug: reclaiming-data-autonomy-as-a-peasant, title: Reclaiming Data Autonomy as a Peasant }
